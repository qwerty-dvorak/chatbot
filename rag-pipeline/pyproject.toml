[project]
name = "rag-pipeline"
version = "0.1.0"
description = "Standalone document ingestion and advanced RAG pipeline"
requires-python = ">=3.12"
dependencies = [
    "pymilvus>=2.4.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "click>=8.0.0",
    "pillow>=10.0.0",
    "pypdf>=4.0.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.24.0",
    "tqdm>=4.0.0",
    "tenacity>=8.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.49.0",
    "python-multipart>=0.0.32",
    "litellm>=1.87.1",
    "aiofiles>=25.1.0",
]

[tool.uv]
dev-dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
