{% extends "base.html" %}
{% block title %}Ingestion Queue — Knowledge{% endblock %}
{% block content %}
<div class="page-header">
  <div style="display:flex;align-items:center;gap:12px">
    <a href="{% url 'knowledge:list' %}" class="btn btn-ghost btn-sm" style="padding:5px 8px">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M10.5 3L5.5 8l5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    </a>
    <h1>Ingestion Queue</h1>
  </div>
  <div style="display:flex;gap:8px">
    <a href="{% url 'knowledge:list' %}" class="btn btn-ghost btn-sm">Knowledge</a>
    <a href="{% url 'knowledge:upload' %}" class="btn btn-primary btn-sm">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M8 2a.75.75 0 01.75.75v4.5h4.5a.75.75 0 010 1.5h-4.5v4.5a.75.75 0 01-1.5 0v-4.5h-4.5a.75.75 0 010-1.5h4.5v-4.5A.75.75 0 018 2z"/></svg>
      Upload
    </a>
  </div>
</div>

<div id="queue-container">
  <div style="text-align:center;padding:48px;color:var(--text3)">Loading queue…</div>
</div>

<script>
(function() {
  var container = document.getElementById('queue-container');

  function loadQueue() {
    container.innerHTML = '<div style="text-align:center;padding:48px;color:var(--text3)">Loading…</div>';
    fetch('{% url "knowledge:queue-data" %}')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        renderJobs(data.jobs || []);
      })
      .catch(function() {
        container.innerHTML = '<div class="card" style="text-align:center;padding:48px;color:var(--red)">Failed to load queue</div>';
      });
  }

  function renderJobs(jobs) {
    if (!jobs.length) {
      container.innerHTML = '<div class="card" style="text-align:center;padding:48px"><p style="color:var(--text2)">No ingestion jobs.</p></div>';
      return;
    }
    var html = '<div class="queue-list">';
    jobs.forEach(function(job) {
      var isActive = job.status === 'queued' || job.status === 'running';
      var stepInfo = '';
      if (job.current_step) {
        stepInfo = '<span class="queue-step">' + job.current_step.replace(/_/g, ' ') + '</span>';
      }
      if (job.progress_pct != null) {
        stepInfo += '<span class="queue-pct">' + job.progress_pct + '%</span>';
      }
      html += '<div class="queue-item queue-' + job.status + '" data-job-id="' + job.id + '">';
      html += '<div class="queue-item-body">';
      html += '<div class="queue-item-title"><a href="{% url "knowledge:list" %}' + job.document_id + '/">' + escapeHtml(job.title) + '</a></div>';
      html += '<div class="queue-item-meta">';
      html += '<span class="badge badge-' + job.status + '">' + job.status + '</span>';
      html += stepInfo;
      if (job.error) html += '<span class="queue-error">' + escapeHtml(job.error.substring(0, 80)) + '</span>';
      html += '<span class="queue-time" title="' + (job.created_at || '') + '">' + (job.created_at ? new Date(job.created_at).toLocaleString() : '') + '</span>';
      html += '</div>';
      if (job.steps && job.steps.length) {
        html += '<div class="queue-steps-bar">';
        job.steps.forEach(function(s) {
          var cls = 'queue-step-dot';
          if (s.status === 'completed') cls += ' dot-done';
          else if (s.status === 'running') cls += ' dot-running';
          else if (s.status === 'failed') cls += ' dot-failed';
          else cls += ' dot-pending';
          html += '<span class="' + cls + '" title="' + (s.name || '') + ': ' + (s.status || '') + '"></span>';
        });
        html += '</div>';
      }
      html += '</div>';
      html += '<div class="queue-item-actions">';
      if (isActive) {
        html += '<button class="topbar-btn" onclick="cancelJob(\'' + job.id + '\')" title="Cancel"><svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M2 4a2 2 0 012-2h8a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2V4z"/></svg></button>';
      }
      html += '<button class="topbar-btn" onclick="deleteJob(\'' + job.id + '\')" title="Delete" style="color:var(--red)"><svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M5.5 5.5A.5.5 0 016 6v6a.5.5 0 01-1 0V6a.5.5 0 01.5-.5zm2.5 0a.5.5 0 01.5.5v6a.5.5 0 01-1 0V6a.5.5 0 01.5-.5zm3 .5a.5.5 0 00-1 0v6a.5.5 0 001 0V6z"/><path d="M14.5 3a1 1 0 01-1 1H13v9a2 2 0 01-2 2H5a2 2 0 01-2-2V4h-.5a1 1 0 01-1-1V2a1 1 0 011-1H6a1 1 0 011-1h2a1 1 0 011 1h3.5a1 1 0 011 1v1z"/></svg></button>';
      html += '</div>';
      html += '</div>';
    });
    html += '</div>';
    container.innerHTML = html;
    setTimeout(loadQueue, 5000);
  }

  function escapeHtml(s) {
    if (!s) return '';
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  window.cancelJob = function(jobId) {
    if (!confirm('Cancel this ingestion job?')) return;
    fetch('{% url "knowledge:queue" %}' + jobId + '/', {
      method: 'PATCH',
      headers: {'X-CSRFToken': '{{ csrf_token }}', 'Content-Type': 'application/json'},
      body: JSON.stringify({action: 'cancel'})
    })
    .then(function(r) { return r.json(); })
    .then(function(d) { loadQueue(); })
    .catch(function() {});
  };

  window.deleteJob = function(jobId) {
    if (!confirm('Delete this job and its document?')) return;
    fetch('{% url "knowledge:queue" %}' + jobId + '/', {
      method: 'PATCH',
      headers: {'X-CSRFToken': '{{ csrf_token }}', 'Content-Type': 'application/json'},
      body: JSON.stringify({action: 'delete'})
    })
    .then(function(r) { return r.json(); })
    .then(function(d) { loadQueue(); })
    .catch(function() {});
  };

  loadQueue();
})();
</script>

<style>
.queue-list { display: flex; flex-direction: column; gap: 8px; }
.queue-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: var(--bg);
  border: 1px solid var(--bd);
  border-radius: var(--r);
  transition: box-shadow .13s;
}
.queue-item:hover { box-shadow: 0 1px 4px rgba(0,0,0,.06); }
.queue-item-body { flex: 1; min-width: 0; }
.queue-item-title { font-weight: 500; font-size: .9375rem; }
.queue-item-title a { color: var(--text); text-decoration: none; }
.queue-item-title a:hover { color: var(--accent); }
.queue-item-meta { display: flex; align-items: center; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
.queue-step { font-size: .75rem; color: var(--text2); font-family: var(--mono); }
.queue-pct { font-size: .7rem; color: var(--text3); font-weight: 600; }
.queue-error { font-size: .72rem; color: var(--red); }
.queue-time { font-size: .68rem; color: var(--text3); margin-left: auto; }
.queue-item-actions { display: flex; gap: 2px; flex-shrink: 0; }
.queue-steps-bar { display: flex; gap: 3px; margin-top: 6px; }
.queue-step-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--bd);
  flex-shrink: 0;
}
.queue-step-dot.dot-done { background: var(--green); }
.queue-step-dot.dot-running { background: var(--accent); animation: pulse 1s infinite; }
.queue-step-dot.dot-failed { background: var(--red); }
.queue-step-dot.dot-pending { background: var(--bd); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
@media (max-width: 640px) {
  .queue-item { flex-direction: column; align-items: stretch; }
  .queue-item-actions { justify-content: flex-end; }
}
</style>
{% endblock %}
