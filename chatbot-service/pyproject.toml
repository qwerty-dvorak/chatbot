[project]
name = "chatbot"
version = "0.1.0"
description = "Local Django chatbot with RAG, memory, and tool calling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1.2,<5.2",
    "psycopg[binary]>=3.2,<3.3",
    "python-dotenv>=1.0,<1.1",
    "whitenoise>=6.7,<6.8",
    "gunicorn>=23.0,<23.1",
    "requests>=2.32.5",
    "pymilvus>=2.6.2",
]

[tool.uv]
exclude-newer = "2025-10-23T12:36:00Z"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",
    "D212",
    "COM812",
    "E501",
]

